name: SecureBank DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ========================================================
  # STAGE 1: Secret Scanning
  # Catches API keys, passwords, and tokens before building
  # ========================================================
  secrets-scan:
    name: "Gate 1: Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================
  # STAGE 2: Static Analysis (SAST) & Dependencies (SCA)
  # Analyzes C#/JS source code and third-party libraries
  # ========================================================
  code-and-dependencies:
    name: "Gate 2: SAST (Semgrep) & SCA (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # SAST: Identifies code patterns like SQLi and XSS
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten

      # SCA: Scans NuGet packages and npm packages for CVEs
      - name: Run Trivy Filesystem Scan (SCA)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ========================================================
  # STAGE 3: Container Security
  # Scans the Docker image for vulnerable OS libraries
  # ========================================================
  container-scan:
    name: "Gate 3: Docker Image Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Pull Docker Hub Image
        run: docker pull ssrd/securebank:latest

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'ssrd/securebank:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ========================================================
  # STAGE 4: Dynamic Application Testing (DAST)
  # Runs the app and probes live endpoints for flaws
  # ========================================================
  dast-scan:
    name: "Gate 4: Dynamic Scan (OWASP ZAP)"
    runs-on: ubuntu-latest
    permissions:
      issues: write # Grants permission to create issues
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Spin up SecureBank Container
        run: |
          docker run -d -p 80:80 ssrd/securebank:latest
          sleep 25 # Allow web server to boot

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:80'
          fail_action: false
